version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cyclecare_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyclecare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyclecare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyclecare_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=dev
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ML_SERVICE_URL=http://ml-service:8001
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8100,capacitor://localhost
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cyclecare_net

  ml-service:
    image: python:3.11-slim
    container_name: cyclecare_ml_service
    working_dir: /app
    volumes:
      - ./ml-service:/app
    ports:
      - "8001:8001"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn --host 0.0.0.0 --port 8001 main:app --reload || tail -f /dev/null"
    networks:
      - cyclecare_net

volumes:
  postgres_data:
  backend_media:

networks:
  cyclecare_net:
    driver: bridge
